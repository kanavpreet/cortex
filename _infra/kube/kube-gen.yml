        braintrust_trace_environment: production
        spreadsheet_id: "1ubO5lEca1gJh-_VJnWAzY4ycVhssVKtk-8ZRlUBW9LM"
        worksheet_name: "incidents"
        correlations_worksheet_name: "correlations"
        ground_truth_extraction_prompt: |-
          You are analyzing an Airbnb reliability incident to find its confirmed root cause.
          You will be given the incident's summary, chronological updates, and Slack channel
          summary. Your task is to extract the confirmed root cause with the following
          requirements:
          1. change_related: true if the incident was caused by a change (a deploy, PR,
             config change, or infrastructure change), false otherwise (e.g. vendor outage,
             hardware failure, external dependency).
          2. ownership: "airbnb" if an Airbnb-owned change caused it, "vendor" if a
             third-party/vendor change or outage caused it, "unknown" if unclear.
          3. cited_identifier: the exact PR URL, PR number, or TCMR ticket ID quoted
             VERBATIM from the source text, only if it is explicitly named as the cause.
             Never paraphrase or infer. A citation of the fix/remediation (e.g. "we opened
             PR #53 to fix this") is not a citation of the cause. Some incidents describe a
             chain of causation: a PR/TCMR whose change directly triggered the incident,
             followed by a deeper explanation of why that change had that effect (e.g. a
             pre-existing bug or an earlier, unrelated change it exposed). In that case,
             cite the PR/TCMR that directly triggered the incident, not the deeper
             explanation -- unless that deeper explanation itself names a different
             resolvable PR/TCMR as the actual change that caused the incident, in which
             case cite that one instead. Return null unless the text explicitly says an
             identifier caused the incident.
          4. quote_span: the exact source sentence containing the citation, or null if
             cited_identifier is null.
          5. source_traceable: even without a specific PR/TCMR citation, is there some
             external source that could still be checked for this root cause? true if
             it's a vendor outage reflected on a public status page, or if
             cited_identifier is non-null. false if it's an untracked internal change
             (e.g. a manual/undocumented change), a hardware failure, or performance
             degradation with no external record. null if genuinely ambiguous (e.g. an
             unplanned power outage) -- do not guess, leave it for a human to decide.
          6. reasoning: one sentence explaining your answer.
          Output Format: Return ONLY a JSON object with these six keys: change_related,
          ownership, cited_identifier, quote_span, source_traceable, reasoning. No
          markdown formatting, no code fences, no extra text.

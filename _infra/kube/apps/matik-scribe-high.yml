---
workload:
  deployment:
    autoscaling:
      minReplicas: 1
      maxReplicas: 10
      # Scribe high-priority lane: aggressive scale-up to drain near real-time
      targetCPUUtilizationPercentage: 50
      telescopeMetrics:
        - name: queue-length
          query: |-
            aws_sqs_approximate_number_of_messages_visible{queue_name=~"matik-scrb-high-staging-queue"}
          tenant: cloudwatch
          target:
            value: 50
            type: Value

mainContainer:
  name: matik-scribe-high
  imageSpec: scribe-dockerfile
  command:
    - python
    - -m
    - scribe

  resources:
    requests:
      cpu: 500m
      memory: 1000Mi
      ephemeral-storage: 512Mi
    limits:
      memory: 1000Mi
      ephemeral-storage: 512Mi

  # Readiness and liveness probes
  # Temp: no HTTP server exposed, so use exec probe to check PID 1 (main process) is alive
  livenessProbe:
    exec:
      command: ["sh", "-c", "kill -0 1"]
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3

  readinessProbe:
    exec:
      command: ["sh", "-c", "kill -0 1"]
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  # File mount for matik config and not volume mount for config separation
  # use volumeMount for directories
  fileMounts:
    - filename: matik-scribe-high-config.yml
      mountPath: /app/config/matik-scribe-config.yml
    - filename: metrics.yml
      mountPath: /app/config/metrics.yml


components:
- name: secrets
- name: logging

iamRole: matik-staging

# Disable veneur sidecar and rely on otel-collector for all metrics
disableVeneur: true

supportedCPUArchitectures:
  - amd64
  - arm64

environments:
  staging: {}
  canary:
    iamRole: matik-production
    workload:
      deployment:
        autoscaling:
          telescopeMetrics:
            - name: queue-length
              query: |-
                aws_sqs_approximate_number_of_messages_visible{queue_name=~"matik-scrb-high-production-queue"}
              tenant: cloudwatch
              target:
                value: 50
                type: Value
  production:
    iamRole: matik-production
    workload:
      deployment:
        autoscaling:
          telescopeMetrics:
            - name: queue-length
              query: |-
                aws_sqs_approximate_number_of_messages_visible{queue_name=~"matik-scrb-high-production-queue"}
              tenant: cloudwatch
              target:
                value: 50
                type: Value
  sandbox:
    iamRole: matik-sandbox
    workload:
      deployment:
        autoscaling:
          telescopeMetrics:
            - name: queue-length
              query: |-
                aws_sqs_approximate_number_of_messages_visible{queue_name=~"matik-scrb-high-sandbox-queue"}
              tenant: cloudwatch
              target:
                value: 50
                type: Value

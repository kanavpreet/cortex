---
workload:
  job:
    restartPolicy: Never
    backoffLimit: 3 # Retry up to X times on failure
    ttlSecondsAfterFinished: 86400 # Keep job history for X seconds after completion
    activeDeadlineSeconds: 600 # Kill job if migrations take longer X seconds

mainContainer:
  name: matik-migrator
  imageSpec: migrator-dockerfile
  command:
    - python
    - -m
    - migrator
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # File mount for matik config and not volume mount for config separation
  # use volumeMount for directories
  fileMounts:
    - filename: matik-migrator-config.yml
      mountPath: /app/config/matik-migrator-config.yml
  volumeMounts:
    - mountPath: /tmp/pod
      name: tmp-pod
      readOnly: false

components:
- name: secrets

# airmeshOnly: true

# attributes:
#   extraPodAnnotations:
#     com.airbnb.container-injector-mutator/mem-mini-announcer: 48Mi

iamRole: matik-staging

# Disable veneur sidecar and rely on otel-collector for all metrics
disableVeneur: true

supportedCPUArchitectures:
  - amd64
  - arm64

environments:
  staging: {}
  canary:
    iamRole: matik-production
  production:
    iamRole: matik-production
  sandbox:
    iamRole: matik-sandbox

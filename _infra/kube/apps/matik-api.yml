---
workload:
  deployment:
    replicas: 1

mainContainer:
  name: matik-api
  imageSpec: api-dockerfile
  command:
    - python
    - -m
    - uvicorn
    - api.main:app
    - --host
    - "0.0.0.0"
    - --port
    - 8080
    - --no-access-log

  resources:
    requests:
      cpu: 500m
      memory: 1000Mi
      ephemeral-storage: 512Mi
    limits:
      memory: 1000Mi
      ephemeral-storage: 512Mi

  # Health check configuration using HTTP endpoints
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # File mount for matik config and not volume mount for config separation
  # use volumeMount for directories
  fileMounts:
    - filename: matik-api-config.yml
      mountPath: /app/config/matik-api-config.yml
    - filename: metrics.yml
      mountPath: /app/config/metrics.yml


components:
- name: secrets
- name: logging

attributes:
  extraPodAnnotations:
    com.airbnb.container-injector-mutator/mem-mini-announcer: 48Mi

service:
  ports:
  - port: 8080

iamRole: matik-staging

# Disable veneur sidecar and rely on otel-collector for all metrics
disableVeneur: true

supportedCPUArchitectures:
  - amd64
  - arm64

environments:
  staging: {}
  canary:
    iamRole: matik-production
    workload:
      deployment:
        replicas: 1
  production:
    iamRole: matik-production
    workload:
      deployment:
        autoscaling:
          minReplicas: 1
          maxReplicas: 4
          targetCPUUtilizationPercentage: 50
  sandbox:
    iamRole: matik-sandbox

---
# Common configuration for Matik API
# Documentation: https://developers.a.musta.ch/docs/default/component/kube-gen/kube-gen/configs/files

# Common configuration shared across services
common:
  environment: {{ .Env.Name }}  # Deployment environment
  port: {{ .Env.Params.port }}  # Service port
  log_level: INFO  # Logging level

# Phase 1c: service-to-service request signing (see common/utils/service_auth.py).
# service_secret unset/empty disables the check entirely. enforce_service_signature
# defaults to false (shadow mode: failures are logged, not rejected) so it can be
# rolled out per environment once the secret is provisioned and shadow logs are clean.
api:
  service_secret: '{{ .App.Secrets.api.service_secret | default "" }}'
  enforce_service_signature: {{ .Env.Params.api.enforce_service_signature | default false }}

# Enigmatologist SQS configuration (for correlation dispatch)
enigmatologist:
  sqs_queue_url: {{ .Env.Params.enigmatologist.sqs_queue_url }}
  sqs_queue_region: {{ .Env.Params.enigmatologist.sqs_queue_region }}

# Database configuration supporting AWS IAM authentication for RDS connections
mysql:
  engine: mysql  # Database engine type, e.g. 'mysql'
  endpoint: {{ .Env.Params.mysql.rds_endpoint }}  # Database host/endpoint, e.g. 'localhost' or RDS endpoint
  port: 3306  # Database port, default 3306 for MySQL
  username: {{ .Env.Params.mysql.default_rds_username }}  # Username for database authentication
  password: '{{ .App.Secrets.mysql.default_rds_password | default "" }}'  # Password for traditional authentication (not used when use_iam is True)
  database: {{ .Env.Params.mysql.rds_database }}  # Database name to connect to
  ssl_mode: 'required'  # SSL/TLS mode: 'required', 'preferred', or 'disabled'
  # Connection pool settings
  max_open_conns: {{ .Env.Params.mysql.api.max_open_conns }}  # Maximum number of open connections to the database
  max_idle_conns: {{ .Env.Params.mysql.api.max_idle_conns }}  # Maximum number of idle connections in the pool
  conn_max_idle_time_minutes: {{ .Env.Params.mysql.api.conn_max_idle_time_minutes }}  # Maximum time a connection can be idle before being closed
  use_iam: {{ .Env.Params.mysql.use_iam }}  # Enable AWS IAM authentication for RDS connections
  # Settings used when using IAM auth, use_iam: true -- COMMENT OUT BELOW ONCE WE FULLY MIGRATE ALL ENVS TO THE NEW DB
  # token_expiry_minutes: {{ .Env.Params.mysql.iam.token_expiry_minutes | default 15 }}  # IAM token lifetime in minutes. AWS RDS tokens are valid for 15 minutes
  # token_expiry_grace_minutes: {{ .Env.Params.mysql.iam.token_expiry_grace_minutes | default 1 }}  # Minutes before token expiry to trigger refresh
  # canonical_endpoint: '{{ .Env.Params.mysql.rds_canonical_endpoint | default "" }}'  # Official RDS cluster endpoint for TLS validation and IAM token generation
  # corpinfra_role_arn: '{{ .Env.Params.mysql.api.corpinfra_role_arn | default "" }}'  # ARN of the CORPINFRA-PROD IAM role to assume before connecting
  # region: '{{ .Env.Params.mysql.aws_region | default "" }}'  # AWS region for IAM authentication (required when use_iam is True)

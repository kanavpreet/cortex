      - matik-chronicler
      - matik-api
      - matik-enigmatologist
      - matik-enricher
      - matik-scribe-high
      - matik-scribe-medium
      - matik-scribe-low
    environment: production
    cells:
      - pug
      - taz
      - yun
    rollout:
      strategy: bluegreen
      params:
        pauseSeconds: 300 # 5 minutes
  timeoutMinutes: 15
  title: Deploy to Production
  dependsOn:
    - run-migrations-production
    - deploy-to-production-mesh
- name: deploy-to-production-jobs
  type: cellularDeploy
  parameters:
    apps:

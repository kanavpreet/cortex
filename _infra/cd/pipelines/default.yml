description: Safely deploys matik to all environments
triggers:
- type: cron
  cronExpression: 0 0 14 ? * MON
stages:
- name: check-running-pipelines
  type: checkRunningPipelines
  parameters:
    pipelineNames:
    - emergency
- name: branch-control
  type: enforceBranchControl
  title: Branch Control
  dependsOn:
    - check-running-pipelines


########## Deploy to Staging ##########
- name: deploy-to-staging-mesh
  type: onetouchDeploy
  parameters:
    apps:
    - matik-staging
    environment: mesh
    context: mesh-mgmt-a-ea1-us
  timeoutMinutes: 5
  title: Deploy mesh configs to staging
- name: run-migrations-staging
  type: onetouchJob
  parameters:
    jobName: matik-migrator
    environment: staging
    cell: pug
    timeoutMinutes: 10
    waitForCompletion: true
  title: Run database migrations
  dependsOn:
    - branch-control
    - deploy-to-staging-mesh
- name: deploy-to-staging
  type: cellularDeploy
  parameters:
    apps:
      - matik-mcp
      - matik-chronicler
      - matik-api
      - matik-enigmatologist
      - matik-enricher
      - matik-scribe-high
      - matik-scribe-medium
      - matik-scribe-low
    environment: staging
    cells:
      - pug
      - taz
      - yun
    rollout:
      strategy: bluegreen
      params:
        pauseSeconds: 300 # 5 minutes
  timeoutMinutes: 15
  title: Deploy to Staging
  dependsOn:
    - run-migrations-staging
    - deploy-to-staging-mesh
- name: deploy-to-staging-jobs
  type: cellularDeploy
  parameters:
    apps:
      - matik-historian-biztech-github
      - matik-historian-incidentio
      - matik-historian-jira
      - matik-audit-root-cause
    environment: staging
    # Cronjobs should only be deployed to a single cell to avoid duplicate runs
    cells:
      - pug
  title: Deploy Jobs to Staging
  dependsOn:
    - run-migrations-staging
    - deploy-to-staging-mesh


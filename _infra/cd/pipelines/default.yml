- name: manual-judgment
  title: Manual Judgment
  type: manualJudgment
  dependsOn:
    - deploy-to-staging
    - deploy-to-staging-jobs
- name: deploy-to-production-mesh
  type: onetouchDeploy
  parameters:
    apps:
    - matik-production
    environment: mesh
    context: mesh-mgmt-a-ea1-us
  timeoutMinutes: 5
  title: Deploy mesh configs to production
  dependsOn:

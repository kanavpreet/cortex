---
# Spinnaker pipeline docs: https://developers.airbnb.tools/projects/spinnaker/docs/users/managing_pipelines
description: >
  Resets the sandbox environment. Scales down all services, runs DB downgrade
  to clear the schema, purges all SQS queues automatically, then redeploys everything cleanly.
  See _infra/docs/development/reset-matik.md for the full runbook.

stages:

  # -------------------------------------------------------------------------
  # Scale down — stop all services before touching the DB/SQS
  # -------------------------------------------------------------------------
  - name: deploy-to-sandbox-mesh-configs
    type: onetouchDeploy
    parameters:
      apps:
      - matik-sandbox
      environment: mesh
      context: mesh-mgmt-a-ea1-us
    timeoutMinutes: 5
    title: Deploy mesh configs to sandbox

  - name: scale-down-scribe-high
    type: scaleManifest
    title: Scale down Scribe High
    parameters:
      application: matik-scribe-high
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  - name: scale-down-scribe-medium
    type: scaleManifest
    title: Scale down Scribe Medium
    parameters:
      application: matik-scribe-medium
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  - name: scale-down-scribe-low
    type: scaleManifest
    title: Scale down Scribe Low
    parameters:
      application: matik-scribe-low
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  - name: scale-down-enricher
    type: scaleManifest
    title: Scale down Enricher
    parameters:
      application: matik-enricher
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  - name: scale-down-enigmatologist
    type: scaleManifest
    title: Scale down Enigmatologist
    parameters:
      application: matik-enigmatologist
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  - name: scale-down-chronicler
    type: scaleManifest
    title: Scale down Chronicler
    parameters:
      application: matik-chronicler
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  - name: scale-down-api
    type: scaleManifest
    title: Scale down API
    parameters:
      application: matik-api
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  - name: scale-down-mcp
    type: scaleManifest
    title: Scale down MCP
    parameters:
      application: matik-mcp
      environment: sandbox
      replicas: 0
      context: m-n-pug
    dependsOn:
      - deploy-to-sandbox-mesh-configs

  # - name: scale-down-dbmanager
  #   type: scaleManifest
  #   title: Scale down DBManager
  #   parameters:
  #     application: matik-dbmanager
  #     environment: sandbox
  #     replicas: 0
  #     context: m-n-pug
  #   dependsOn:
  #     - deploy-to-sandbox-mesh-configs

  # -------------------------------------------------------------------------
  # Manual judgment — confirm before the destructive DB downgrade runs
  # -------------------------------------------------------------------------

  - name: manual-judgment-before-downgrade-sandbox
    type: manualJudgment
    title: Confirm database downgrade
    instructions: >
      This will downgrade the sandbox database schema to base, erasing all
      data, then purge all SQS queues and redeploy. Confirm this is intended
      before proceeding — there is no undo.
    dependsOn:
      - scale-down-scribe-high
      - scale-down-scribe-medium
      - scale-down-scribe-low
      - scale-down-enricher
      - scale-down-enigmatologist
      - scale-down-chronicler
      - scale-down-api
      # - scale-down-dbmanager

  # -------------------------------------------------------------------------
  # Downgrade migrations — clears the DB schema after all services are down
  # -------------------------------------------------------------------------

  - name: downgrade-migrations-sandbox
    type: onetouchJob
    title: Downgrade database migrations to base
    parameters:
      jobName: matik-migrator-downgrade
      environment: sandbox
      cell: pug
      timeoutMinutes: 10
      waitForCompletion: true
    dependsOn:
      - manual-judgment-before-downgrade-sandbox

  # -------------------------------------------------------------------------
  # Purge SQS queues — runs automatically after DB downgrade
  # -------------------------------------------------------------------------

  - name: purge-sqs-sandbox
    type: onetouchJob
    title: Purge all sandbox SQS queues
    parameters:
      jobName: matik-sqspurger
      environment: sandbox
      cell: pug
      timeoutMinutes: 5
      waitForCompletion: true
    dependsOn:
      - downgrade-migrations-sandbox

  # -------------------------------------------------------------------------
  # Redeploy — bring everything back up against the clean DB
  # -------------------------------------------------------------------------

  - name: manual-wait
    type: manualJudgment
    title: Manual wait to trigger redeploy.
    instructions: Wait for the SQS purge to complete before proceeding with redeploy. Allows to clear metrics as well.
    timeoutMinutes: 60
    dependsOn:
      - purge-sqs-sandbox

  - name: deploy-to-sandbox-mesh
    type: onetouchDeploy
    title: Deploy mesh configs to sandbox
    parameters:
      apps:
        - matik-sandbox
      environment: mesh
      context: mesh-mgmt-a-ea1-us
    timeoutMinutes: 5
    dependsOn:
      - manual-wait

  - name: run-migrations-sandbox
    type: onetouchJob
    title: Run database migrations
    parameters:
      jobName: matik-migrator
      environment: sandbox
      cell: pug
      timeoutMinutes: 10
      waitForCompletion: true
    dependsOn:
      - manual-wait
      - deploy-to-sandbox-mesh

  - name: deploy-to-sandbox
    type: cellularDeploy
    title: Deploy services to Sandbox
    parameters:
      apps:
        - matik-mcp
        - matik-chronicler
        - matik-api
        - matik-enigmatologist
        - matik-enricher
        - matik-dbmanager
        - matik-scribe-high
        - matik-scribe-medium
        - matik-scribe-low
      environment: sandbox
      cells:
        - pug
      rollout:
        strategy: bluegreen
        params:
          pauseSeconds: 300
    timeoutMinutes: 15
    dependsOn:
      - run-migrations-sandbox

  - name: deploy-to-sandbox-jobs
    type: cellularDeploy
    title: Deploy jobs to Sandbox
    parameters:
      apps:
        - matik-historian-biztech-github
        - matik-historian-incidentio
        - matik-historian-jira
        - matik-audit-root-cause
      environment: sandbox
      cells:
        - pug
    dependsOn:
      - run-migrations-sandbox

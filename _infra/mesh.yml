  namespace: matik-canary
############### End Matik API Services ###############

############### Matik MCP Server Services ###############
matik-mcp-sandbox:
  type: service
  mesh: ea1.us
  namespace: matik-sandbox
  dependentServices:
    - host: matik-api-sandbox.matik-sandbox
    - host: presto-gateway-production.presto-gateway-production
    - host: mofi-production.mofi-production
  ports:
    http-8080:
      protocol: http
      number: 8080
      authz:
        - allows:
            - matik-api-sandbox.matik-sandbox
            - matik-integration-tests-sandbox.matik-sandbox
          ldapAllows:
            - "matik.engineering.airbnb.com"
          svcAcctAllows:
            - "svc-ops-eng@iap-prod-bc8f.iam.gserviceaccount.com"
      devAccessName: mcp-matik-sandbox


matik-mcp-staging:
  type: service
  mesh: ea1.us
  namespace: matik-staging
  dependentServices:
    - host: matik-api-staging.matik-staging
    - host: presto-gateway-production.presto-gateway-production
    - host: mofi-production.mofi-production
  ports:
    http-8080:
      protocol: http
      number: 8080
      clientOptions:
        loadBalancing:
          mode:
            type: CONSISTENT_HASH
            consistentHashOptions:
              headerName: X-GOOG-AUTHENTICATED-USER-EMAIL
              minimumRingSize: 1024
          locality:
            enabled: false
      authz:
        - allows:
            - matik-api-staging.matik-staging
            - matik-integration-tests-staging.matik-staging
          ldapAllows:
            - "matik.engineering.airbnb.com"
          svcAcctAllows:
            - "svc-ops-eng@iap-prod-bc8f.iam.gserviceaccount.com"
      devAccessName: mcp-matik-staging

matik-mcp-production:
  type: service
  mesh: ea1.us
  namespace: matik-production
  dependentServices:
    - host: matik-api-production.matik-production
    - host: presto-gateway-production.presto-gateway-production
    - host: mofi-production.mofi-production
  ports:
    http-8080:
      protocol: http
      number: 8080
      clientOptions:
        loadBalancing:
          mode:
            type: CONSISTENT_HASH
            consistentHashOptions:
              headerName: X-GOOG-AUTHENTICATED-USER-EMAIL
              minimumRingSize: 1024
          locality:
            enabled: false
      authz:
        - allows:
            - matik-api-production.matik-production
            - matik-integration-tests-production.matik-production
            # Canary allows
            - matik-api-canary.matik-canary
            - matik-integration-tests-canary.matik-canary
          ldapAllows:
            - "matik.engineering.airbnb.com"
          svcAcctAllows:
            - "svc-ops-eng@iap-prod-bc8f.iam.gserviceaccount.com"
      devAccessName: mcp-matik

matik-mcp-canary:
  extends: matik-mcp-production
  namespace: matik-canary

############### End Matik MCP Server Services ###############


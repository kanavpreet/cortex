############### Matik Audit Services ###############
matik-audit-root-cause-sandbox:
  type: app
  mesh: ea1.us
  namespace: matik-sandbox
  name: matik-audit-root-cause-sandbox
  egressConfig:
    enabled: true
  dependentServices:
    - host: llm-fusion-hub-staging.llm-fusion-hub-staging
    - host: biztech-master.proxysql-production
    # BraintrustClient always targets the production proxy, regardless of
    # our own env.
    - host: braintrust-proxy-production.braintrust-proxy-production
    # Mints the IAT that authenticates the call above.
    - host: hunter2s-production.hunter2s-production

matik-audit-root-cause-staging:
  type: app
  mesh: ea1.us
  namespace: matik-staging
  name: matik-audit-root-cause-staging
  egressConfig:
    enabled: true
  dependentServices:
    - host: llm-fusion-hub-staging.llm-fusion-hub-staging
    - host: biztech-master.proxysql-production
    # BraintrustClient always targets the production proxy, regardless of
    # our own env.
    - host: braintrust-proxy-production.braintrust-proxy-production
    # Mints the IAT that authenticates the call above. ServiceIatCredential's
    # _endpoint_factory (airbnb_identity/credentials/iat.py) routes to
    # hunter2s-staging, not hunter2s-production, whenever "staging" appears in
    # the pod's own k8s namespace -- this must match that, not the sandbox/
    # production entries' host.
    - host: '*.hunter2s-staging'

matik-audit-root-cause-production:
  type: app
  mesh: ea1.us
  namespace: matik-production
  name: matik-audit-root-cause-production
  egressConfig:
    enabled: true
  dependentServices:
    - host: llm-fusion-hub-production.llm-fusion-hub-production
    - host: biztech-master.proxysql-production
    # BraintrustClient always targets the production proxy, regardless of
    # our own env.
    - host: braintrust-proxy-production.braintrust-proxy-production
    # Mints the IAT that authenticates the call above.
    - host: hunter2s-production.hunter2s-production
############### End Matik Audit Services ###############


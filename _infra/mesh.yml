############### Matik Chronicle Services ###############
# Chronicler is a Kafka consumer with no inbound HTTP and no API/LLM calls.
# Only mesh dep is the Kafka bus. SQS access is granted via IAM, not mesh.
# All environments consume from kafka-prod-a (Yoyo publishes there regardless of env).

matik-chronicler-sandbox:
  type: app
  mesh: ea1.us
  namespace: matik-sandbox
  name: matik-chronicler-sandbox
  dependentServices:
    - host: kafka-prod-a.kafka-prod-a

matik-chronicler-staging:
  type: app
  mesh: ea1.us
  namespace: matik-staging
  name: matik-chronicler-staging
  dependentServices:
    - host: kafka-prod-a.kafka-prod-a

matik-chronicler-production:
  type: app
  mesh: ea1.us
  namespace: matik-production
  name: matik-chronicler-production
  dependentServices:
    - host: kafka-prod-a.kafka-prod-a

# matik-chronicler-canary:
#   extends: matik-chronicler-production
#   namespace: matik-canary
############### End Matik Chronicle Services ###############

############### Matik API Services ###############
matik-api-sandbox:
  type: service
  mesh: ea1.us
  namespace: matik-sandbox
  ports:
    http-8080:
      protocol: http
      number: 8080
      authz:
        - allows:
            - matik-historian-biztech-github-sandbox.matik-sandbox
            - matik-historian-incidentio-sandbox.matik-sandbox
            - matik-historian-jira-sandbox.matik-sandbox
            - matik-enigmatologist-sandbox.matik-sandbox
            - matik-enricher-sandbox.matik-sandbox
            - matik-mcp-sandbox.matik-sandbox
            - matik-integration-tests-sandbox.matik-sandbox
          ldapAllows:
            - "matik.engineering.airbnb.com"
      devAccessName: api-matik-sandbox
  dependentServices:
    - host: biztech-master.proxysql-production

matik-api-staging:
  type: service
  mesh: ea1.us
  namespace: matik-staging
  ports:
    http-8080:
      protocol: http
      number: 8080
      authz:
        - allows:
            - matik-historian-biztech-github-staging.matik-staging
            - matik-historian-incidentio-staging.matik-staging
            - matik-historian-jira-staging.matik-staging
            - matik-enigmatologist-staging.matik-staging
            - matik-enricher-staging.matik-staging
            - matik-mcp-staging.matik-staging
            - matik-integration-tests-staging.matik-staging
          ldapAllows:
            - "matik.engineering.airbnb.com"
      devAccessName: api-matik-staging
  dependentServices:
    - host: biztech-master.proxysql-production

matik-api-production:
  type: service
  mesh: ea1.us
  namespace: matik-production
  ports:
    http-8080:
      protocol: http
      number: 8080
      authz:
        - allows:
            - matik-historian-biztech-github-production.matik-production
            - matik-historian-incidentio-production.matik-production
            - matik-historian-jira-production.matik-production
            - matik-enigmatologist-production.matik-production
            - matik-enricher-production.matik-production
            - matik-mcp-production.matik-production
            - matik-integration-tests-production.matik-production
            # Canary allows
            - matik-historian-biztech-github-canary.matik-canary
            - matik-historian-incidentio-canary.matik-canary
            - matik-historian-jira-canary.matik-canary
            - matik-enigmatologist-canary.matik-canary
            - matik-enricher-canary.matik-canary
            - matik-mcp-canary.matik-canary
            - matik-integration-tests-canary.matik-canary
          ldapAllows:
            - "matik.engineering.airbnb.com"
      devAccessName: api-matik
  dependentServices:
    - host: biztech-master.proxysql-production

matik-api-canary:

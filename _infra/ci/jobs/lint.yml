---
# Python lint job - runs ruff linter and mypy type checker
dockerfile: "../Dockerfile"

steps:
  ########### Install Dependencies ##############
  - type: run
    label: Install dependencies
    command: |
      set -euxo pipefail
      cd matik
      uv sync --group dev

  ########### Run Python Linter ##############
  - type: run
    label: Run ruff linter
    command: |
      set -euxo pipefail
      cd matik
      uv run ruff check .

  ########### Run Type Checker ##############
  - type: run
    label: Run mypy type checker
    command: |
      set -euxo pipefail
      cd matik
      uv run mypy .

  # - type: run
  #   label: Run pyright type checker
  #   command: |
  #     set -euxo pipefail
  #     cd matik
  #     uv run pyright .

  - type: run
    label: Generate failure banner
    id: python-lint-banner
    when: on_failure
    command: |
      echo '{ "style": "error", "body": "**Lint/Type check failed!**<br/>Please fix the issues by running these commands locally:<br/>- `cd matik && uv run ruff check .` (linting)<br/>- `cd matik && uv run mypy .` (type checking)<br/>**See the CI output above for detailed error reports.**" }'

  - type: banner
    label: Display failure banner
    banner_json: "{{python-lint-banner}}"
    when: on_failure
    banner_id: python-lint-failure

[project]
name = "matik-scripts"
version = "0.1.0"
description = "Validation scripts for Matik configuration and infrastructure files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# tester.py embeds HTML/CSS/JS which cannot respect the 88-char line limit
"mcp_load_tester/tester.py" = ["E501"]
"service_signature_tester/tester.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.coverage.run]
omit = [
    # Test files - coverage measures source code, not tests
    "*_test.py",
    # Entry points - minimal bootstrap code that calls main()
    "*/__main__.py",
    "__main__.py",
    "main.py",
]

[tool.coverage.report]
# Exclude CLI entry/orchestration functions from coverage - they are I/O-bound
# and interactive (prompt loops, AWS calls) rather than unit-testable logic.
exclude_lines = [
    "pragma: no cover",
    "def main\\(",
    "def _run_inspect\\(",
    "def _run_redrive\\(",
    "if __name__ == .__main__.:",
]

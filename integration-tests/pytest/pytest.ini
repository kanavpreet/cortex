[pytest]
timeout = 300
asyncio_mode = auto

markers =
    api: API contract tests (endpoints, schemas, status codes)
    llm: LLM integration tests (Facade, Bedrock connectivity)
    smoke: Fast smoke subset for quick validation (<10s each)

addopts =
    -v
    --tb=long
    --html=reports/report.html
    --self-contained-html

# Prometheus Configuration for Matik Metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'matik-local'
    environment: 'local'

# Scrape configurations
scrape_configs:
  # Scrape OTEL Collector's Prometheus exporter
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          job: 'otel-collector'
          deployment_environment: 'local'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          job: 'prometheus'
          deployment_environment: 'local'

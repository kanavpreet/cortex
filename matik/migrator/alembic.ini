[alembic]
# Prepend current directory to sys.path for imports
prepend_sys_path = .

# Path to migration scripts (relative to matik/ directory)
script_location = migrator/alembic

# Template for new migration files
# Use the helper script to create migrations with automatic sequential numbering:
#   ./scripts/create_migration.sh "your description here"
# This will create:
#   - common/migrations/000017_your_description_here.up.sql
#   - common/migrations/000017_your_description_here.down.sql
#   - migrator/alembic/versions/000017_your_description_here.py
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

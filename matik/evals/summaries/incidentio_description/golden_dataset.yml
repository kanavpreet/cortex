# ⚠️  FICTIONAL DATA — NOT REAL EVENTS.
# Golden rows for the incidentio-description summary eval. Synthetic, inspired by real Biztech
# data; every name/id/date is invented. Some `input` rows embed fake PII so the
# pii_safe scorer has something to catch — the `expected` gold summaries never do.
# `input` fields mirror exactly what the enricher sends to the LLM.

- input:
    name: CI build queue stuck and growing
    summary: |-
      Problem: Continuous integration jobs stopped completing and piled up in a rapidly growing queue.

      Impact: Builds across the engineering org were delayed, with the queue peaking above 600 items. Jobs for the orchard-service repository were worst hit, with some blocked for nearly 3 hours, delaying software delivery for several teams. Immediate impact is now resolved.

      Causes: A CI config change in the orchard-service repository created an infinite loop that spawned excessive jobs and automated release PRs, exhausting build resources. It was made worse by managed CI jobs building every discovered branch on each event and by stale branches.

      Steps to resolve: We killed the runaway jobs, canceled the queued orchard-service jobs via API, and reverted the offending CI config change. Triggers were briefly disabled and re-enabled.
  expected: CI builds stalled when the job queue grew past 600 items and stopped completing, with orchard-service repository builds blocked for nearly 3 hours. The failure came from a CI configuration change in orchard-service that introduced an infinite loop, flooding the system with excessive jobs and exhausting build resources. This delayed software delivery for multiple engineering teams.
  metadata:
    reference_id: INC-8001
    status: closed
    created_at: '2026-05-30'
    affected_services: biztech_ci_orchard

- input:
    name: Chatwave messaging outage
    summary: |-
      Problem: Chatwave, the team messaging vendor, had a global outage affecting messaging, workflows, apps, and integrations.

      Impact: Chatwave users worldwide, including many employees in the EMEA region, could not access messaging, workflows, apps, integrations, or APIs starting in the afternoon. Most features recovered overnight; the longest-lingering issues were permissions and the docs feature. All services are now restored.

      Causes: A cascading scheduling failure following an infrastructure change on Chatwave's side disrupted all core services, per their status page. Recovery required configuration adjustments, infrastructure fixes, and cache redeploys.

      Steps to resolve: Chatwave applied configuration and infrastructure fixes and cache updates to fully restore service. We posted status updates to employees and paged the collaboration on-call team.
  expected: Chatwave, the team messaging vendor, experienced a global outage affecting all core services including messaging, workflows, apps, integrations, and APIs. The disruption was caused by a cascading scheduling failure following an infrastructure change on Chatwave's side. Employees worldwide, especially in the EMEA region, were unable to use Chatwave until services were fully restored the next morning.
  metadata:
    reference_id: INC-7990
    status: closed
    created_at: '2026-05-27'
    affected_services: biztech_chatwave

- input:
    name: Cannot provision new accounts in CloudOffice
    summary: |-
      Problem: New user accounts cannot be created in CloudOffice because the premium browser license cap is now strictly enforced.

      Impact: About 90 planned onboardings are blocked, including new employees and support partners. No new CloudOffice accounts can be created since early morning. Existing users are unaffected.

      Causes: The vendor began strictly enforcing the premium browser license cap at the contractual limit of 24,000, where previously it allowed overflow assignments and billed for active users. This blocked new provisioning.

      Steps to resolve: We escalated to the vendor as a P0 and are coordinating to raise or restore the license allocation. Impacted teams were notified.
  expected: New CloudOffice user accounts could not be created after the vendor began strictly enforcing the premium browser license cap at its contractual limit of 24,000. Existing users were unaffected, but the block halted roughly 90 planned onboardings for employees and support partners. Provisioning was blocked from early morning onward.
  metadata:
    reference_id: INC-7965
    status: closed
    created_at: '2026-05-26'
    affected_services: biztech_cloudoffice

- input:
    name: Dev portal 401s during gateway rollout
    summary: |-
      Problem: From the start of a gateway weighted-DNS ramp, the internal developer portal returned 401 'missing credentials' errors on all authenticated API calls when reached through the access proxy. The static UI shell still loaded, but every authenticated portal operation failed for browser users.

      Impact: Around 120 developers could not use the portal during a 2-hour window, losing access to docs and runbooks. The 401 rate climbed with each DNS weight increase. Traffic that bypassed the access proxy was unaffected.

      Causes: A recent change added a filter on the gateway route that stripped the client Authorization header at the load balancer. That was correct for a different host but broke the developer portal, which relies on that header for portal auth.

      Steps to resolve: Resolved via an emergency rollback of the weighted-DNS change, which cleared the 401s within minutes.
  expected: The internal developer portal returned 401 authentication errors on all authenticated API calls during a gateway weighted-DNS rollout, while the static UI shell still loaded. The cause was a configuration change that added a filter stripping the client Authorization header at the load balancer, which broke portal authentication. Roughly 120 developers lost access to documentation and runbooks over a 2-hour window.
  metadata:
    reference_id: INC-7920
    status: closed
    created_at: '2026-05-17'
    affected_services: biztech_dev_portal

- input:
    name: Tycho office network outage
    summary: |-
      Problem: The Tycho office experienced a complete network outage, with all office and guest WiFi and VPN connectivity unavailable from mid-morning local time.

      Impact: All staff in the Tycho office lost office WiFi and VPN connectivity, blocking normal business operations. Guest WiFi was also down, and the security operations team could not reach the badge-access partition or CCTV systems.

      Causes: An unexpected firewall deny rule (rule 88) pushed from the central firewall manager blocked all network traffic at the Tycho office. Rollback attempts failed until the firewall was switched to local policy management and the deny rule was deleted.

      Steps to resolve: We converted the firewall to local policy management and deleted the deny rule, restoring connectivity, then monitored for stability.
  expected: The Tycho office experienced a complete network outage starting mid-morning, taking down office WiFi, guest WiFi, and VPN connectivity. The failure was triggered by an unexpected firewall deny rule (rule 88) pushed from the central firewall manager that blocked all network traffic. Staff lost connectivity for normal business operations, and the security operations team could not access the badge-access partition or CCTV systems.
  metadata:
    reference_id: INC-7880
    status: closed
    created_at: '2026-05-12'
    affected_services: biztech_office_network


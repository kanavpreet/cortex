- input:
    name: Dev access proxy returning fault errors
    summary: |-
      Problem: Multiple development applications behind the dev access proxy became unreachable and returned 'fault filter abort' errors, even though the underlying apps were healthy.

      Impact: Roughly 10-15 active users across APAC and North America could not use at least six dev services, including notebook-dev, tickets-dev, and wiki-dev, blocking time-sensitive work. Production was not affected.

      Causes: A recent dev access-proxy helm chart update, meant to fix naming and IAM policy issues, exhausted the available service IPs in the dev environment, causing outages across multiple dev services.

      Steps to resolve: A temporary DNS patch restored access overnight; a longer-term cleanup of unused services is pending.
  expected: Multiple development applications behind the dev access proxy became inaccessible, returning 'fault filter abort' errors even though the underlying apps were healthy. The cause was a dev access-proxy helm chart update that exhausted available service IPs in the dev environment. Roughly 10 to 15 users across APAC and North America were blocked from at least six dev services, delaying time-sensitive work; production was unaffected.
  metadata:
    reference_id: INC-7835
    status: closed
    created_at: '2026-05-06'
    affected_services: biztech_dev_access_proxy

- input:
    name: Asset-discovery Lambda failing on startup
    summary: |-
      Problem: The 'asset-discovery-prod-proc' Lambda function was failing on startup due to a configuration error, causing permission failures during secrets lookup.

      Impact: The function repeatedly failed in production, disrupting automatic asset discovery and monitoring and creating intermittent monitoring gaps until resolved.

      Causes: A recent code change introduced a JSON syntax error (missing commas) in excluded.json. The invalid JSON made the function fail on startup, leaving orphaned secret tokens and permission-denied errors during auth.

      Steps to resolve: We fixed the JSON syntax in excluded.json, after which the function executed normally and monitoring resumed.
  expected: The asset-discovery-prod-proc Lambda function repeatedly failed in production, disrupting automatic asset discovery and monitoring. The failure was caused by a JSON syntax error (missing commas) in excluded.json, which made the function fail on startup with permission-denied errors during secrets lookup. This created intermittent monitoring gaps until the file was corrected.
  metadata:
    reference_id: INC-7790
    status: closed
    created_at: '2026-05-03'
    affected_services: biztech_observability_discovery

- input:
    name: External partners locked out of vault manager
    summary: |-
      Problem: Some external partners lost access to the VaultManager password tool and cannot sign in. Accounts are suspended, pending activation, or not receiving verification emails. Reported by partner contact Priya Raman (priya.raman@example-partner.com, +1-555-0142).

      Impact: External partners in the 'Partner Training Lead' and 'Partner Training Manager' roles cannot access VaultManager.

      Causes: Recent title-configuration and group-membership changes revoked VaultManager permissions for these partner roles and removed them from the relevant access group.

      Steps to resolve: The affected titles were re-enabled in the access management system, and users regained access after a manual sync.
  expected: Some external partners lost access to the VaultManager password tool and could not sign in, with accounts suspended or pending activation. The cause was recent title-configuration and group-membership changes that revoked VaultManager permissions for certain partner roles and removed them from the relevant access group. Affected external partners in specific training roles were unable to access VaultManager.
  metadata:
    reference_id: INC-7720
    status: closed
    created_at: '2026-04-15'
    affected_services: biztech_vaultmanager

- input:
    name: Ops metrics pipeline failing to reach ticketing
    summary: |-
      Problem: All ops-metrics scheduled jobs failed with 401 Unauthorized errors when connecting to the ticketing system, starting after the last successful run on Friday.

      Impact: The jobs failed to run from Friday until the auth issue was fixed, preventing ops-metrics data in object storage from updating for two days. One day's file has been restored; the other is being backfilled.

      Causes: The jobs used basic authentication with a service account to connect to the ticketing system. After a ticketing maintenance window, that auth method stopped working, causing 401 errors.

      Steps to resolve: We updated the jobs' authentication method and deployed it; jobs now run, and a backfill is recovering the missing day.
  expected: All ops-metrics scheduled jobs failed with 401 Unauthorized errors when connecting to the ticketing system. The cause was a ticketing maintenance window that broke the basic authentication method the jobs used with a service account. As a result, ops-metrics data in object storage was not updated for two days until the authentication was fixed and a backfill recovered the missing data.
  metadata:
    reference_id: INC-7680
    status: closed
    created_at: '2026-04-13'
    affected_services: biztech_ops_metrics

- input:
    name: Knowledge team cannot open content entries
    summary: |-
      Problem: Users received a 'you are not allowed' error when opening content entries in the ContentHub CMS, regardless of VPN status or browser. First reported by the APAC team in the morning.

      Impact: Over 40 users on the Knowledge Management and Support Response teams could not access any content entries; all content types were affected for these internal teams. External help-center access was unaffected.

      Causes: A vendor feature flag ('apply_draft') was enabled for the org as part of an early-access program, which caused access requests to return errors.

      Steps to resolve: The vendor identified the feature flag as the cause and disabled it, restoring access.
  expected: Internal users received 'you are not allowed' errors when accessing ContentHub CMS entries, regardless of VPN or browser. The cause was a vendor feature flag called 'apply_draft', enabled for the org as part of an early-access program, which made access requests return errors. Over 40 users on the Knowledge Management and Support Response teams lost access to all content types, while external help-center access was unaffected.
  metadata:
    reference_id: INC-7610
    status: closed
    created_at: '2026-04-08'
    affected_services: biztech_contenthub

- input:
    name: OTel collector cannot pull image
    summary: |-
      Problem: The OpenTelemetry collector cannot pull its container image from the registry, preventing the log shipper from sending events to the search cluster.

      Impact: No log-shipper monitoring.

      Causes: The collector is unable to retrieve its container image from the registry.

      Steps to resolve: Systems engineering was paged and the incident escalated as high priority.
  expected: The OpenTelemetry collector was unable to pull its container image from the registry, which prevented the log shipper from sending events to the search cluster. This resulted in a loss of log-shipper monitoring. The issue was escalated to systems engineering for investigation.
  metadata:
    reference_id: INC-7560
    status: closed
    created_at: '2026-04-01'
    affected_services: biztech_otel_collector

- input:
    name: Build license expired blocking config updates
    summary: |-
      Problem: About 180 configuration-management nodes were failing during the package-update step because of an expired artifact-repository license.

      Impact: At peak, roughly 180 production nodes (about 65% of managed nodes) could not complete configuration updates, blocking necessary software updates. After remediation only the expected baseline remained failing.

      Causes: The artifact-repository enterprise license expired, blocking access to the package repositories needed for configuration updates.

      Steps to resolve: We renewed the license, restoring access to the repositories, and nodes resumed converging.
  expected: Around 180 production configuration-management nodes (about 65% of managed nodes) failed during the package-update step and could not complete configuration updates. The cause was an expired artifact-repository enterprise license, which blocked access to the package repositories the nodes needed. This prevented necessary software updates across the affected nodes.
  metadata:
    reference_id: INC-7500
    status: closed
    created_at: '2026-03-26'
    affected_services: biztech_config_management

- input:
    name: Beacon VPN unreachable across regions
    summary: |-
      Problem: All users in the APAC region were unable to connect to the Beacon VPN, with similar connectivity issues affecting several other offices.

      Impact: APAC users lost access to the Beacon VPN, a complete outage for internal resources requiring VPN. Other offices also saw WiFi and VPN issues until service was restored.

      Causes: A firewall change made earlier in the day during a separate incident response disrupted VPN and WiFi connectivity in multiple offices by denying DNS traffic. Rolling back the change restored access.

      Steps to resolve: Network engineering identified the firewall change, rolled it back, and restored connectivity across offices.
  expected: Users in the APAC region were unable to connect to the Beacon VPN, with related WiFi and VPN connectivity outages affecting several other offices. The cause was a firewall change made earlier in the day during a separate incident response, which denied DNS traffic. This resulted in a complete loss of access to internal resources requiring VPN connectivity across the affected regions.
  metadata:
    reference_id: INC-7450
    status: closed
    created_at: '2026-03-25'
    affected_services: biztech_office_vpn

- input:
    name: Action buttons missing in Helios CRM
    summary: |-
      Problem: CRM agents cannot see the action-button component in the Helios CRM UI. It was visible earlier today. First reported by agent Marcus Feldt (marcus.feldt@example-corp.test).

      Impact: All agents on the Helios production instance cannot see the action-button component. Some buttons reappeared after a partial filter removal, but not all.

      Causes: Legacy data pipelines that were deprecated earlier in the year were still referenced by CRM filters controlling button visibility; removing those filters triggered the issue.

      Steps to resolve: A rollback was started to revert the manual changes and restore the previous UI state.
  expected: CRM agents on the Helios production instance could no longer see the action-button component in the UI. The cause was legacy data pipelines, deprecated earlier in the year, that were still referenced by CRM filters controlling button visibility; removing those filters triggered the issue. All agents using the Helios production instance were affected until the change was rolled back.
  metadata:
    reference_id: INC-7400
    status: closed
    created_at: '2026-03-24'
    affected_services: biztech_helios_crm


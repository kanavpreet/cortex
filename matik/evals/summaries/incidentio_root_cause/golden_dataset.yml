- input:
    summary: |-
      **Problem**: Employees in one region lost access to the global VPN and the office network due to a network outage.

      **Impact**: Employees in that region could not connect to the global VPN or office network, blocking normal work. Service has been restored.

      **Causes**: An internet link outage between two regional hubs disrupted the office network that carries the region's VPN traffic. The provider confirmed the outage and rerouted the circuit.

      **Steps to resolve**: We escalated to the provider, who restored the circuit by fixing faulty equipment, and began work on backup VPN gateways.
    resolution_statement: The provider replaced the faulty device, which restored connectivity.
  expected: An internet link outage between two regional hubs disrupted the office network that carries the region's VPN traffic, so employees there lost access to the global VPN and office network. The root cause was faulty provider equipment; the network provider replaced the faulty device to restore connectivity.
  metadata:
    reference_id: INC-7995
    status: closed
    created_at: '2026-01-26'
    affected_services: biztech_office_vpn


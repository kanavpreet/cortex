- input:
    summary: |-
      **Problem**: The badge-access controller at the BRT2 site remains unreachable despite power and internet being restored.

      **Impact**: The security operations team cannot access the BRT2 partition and cameras. Employee badge access to BRT2 is not impacted.

      **Causes**: The badge-access server at BRT2 is unresponsive and did not come back online after multiple troubleshooting attempts.

      **Steps to resolve**: Power and internet were restored; the team troubleshot onsite and attempted reboots. We are sourcing a replacement server.
    resolution_statement: Follow-up actions were created to coordinate with building management and the site engineer on the underlying power outage.
  expected: The badge-access controller at the BRT2 site stayed unreachable even after power and internet were restored, leaving the security operations team without access to the BRT2 partition and cameras (employee badge access was unaffected). The server was unresponsive and did not recover after onsite troubleshooting and reboot attempts; a replacement was being sourced and follow-up actions were created to coordinate with building management on the underlying power outage.
  metadata:
    reference_id: INC-7930
    status: closed
    created_at: '2025-12-27'
    affected_services: biztech_office_security


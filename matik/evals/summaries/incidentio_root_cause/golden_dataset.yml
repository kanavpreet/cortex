    status: closed
    created_at: '2026-02-18'
    affected_services: biztech_assetly

- input:
    summary: |-
      **Problem**: Some services across clusters intermittently had egress traffic blocked by the firewalls.

      **Impact**: The plugin that integrates the firewall with the Kubernetes clusters to ingest label-to-IP mappings in real time and propagate them to all managed firewalls had stopped working.

      **Causes**: The plugin was unable to write data to disk following a resizing activity.

      **Steps to resolve**: Restarted the Kubernetes service and force-pushed the IP-to-label mapping from the firewall manager after isolating the issue.
    resolution_statement: Restarted the integration service and re-pushed the label-to-IP mapping from the firewall manager, restoring egress.
  expected: The plugin that syncs Kubernetes label-to-IP mappings to the managed firewalls stopped working because it could not write data to disk after a resizing activity, so the firewalls intermittently blocked egress traffic for services across clusters. It was mitigated by restarting the integration service and re-pushing the IP-to-label mapping from the firewall manager.
  metadata:
    reference_id: INC-8060
    status: closed
    created_at: '2026-02-02'
    affected_services: biztech_firewall_integration


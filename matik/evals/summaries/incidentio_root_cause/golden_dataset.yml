    resolution_statement: After adding the correct endpoint URL, the pod restart issue was resolved.
  expected: The collector pod in the telemetry-collector-prod namespace was missing the correct endpoint URL, which caused errors when building the metrics-export pipelines and drove a high pod restart rate. There was no reported end-user impact. It was resolved by adding the correct endpoint URL.
  metadata:
    reference_id: INC-8110
    status: closed
    created_at: '2026-03-02'
    affected_services: biztech_telemetry_collector

- input:
    summary: |-
      **Problem**: Assetly (the device-inventory system) was unavailable, causing service disruption.

      **Impact**: Downstream services relying on device inventory, such as device enrollments and config evaluations, could not function. Around 1,200 config-lookup failures occurred during the outage.


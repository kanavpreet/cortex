# ⚠️  FICTIONAL DATA — NOT REAL EVENTS.
# Golden rows for the incidentio-root-cause summary eval. Synthetic, inspired by real Biztech
# data; every name/id/date is invented. Some `input` rows embed fake PII so the
# pii_safe scorer has something to catch — the `expected` gold summaries never do.
# `input` fields mirror exactly what the enricher sends to the LLM.

- input:
    summary: |-
      **Problem**: The 'core_platform_team' directory group is only intermittently returned by the directory servers through the access proxy.

      **Impact**: Authentication and authorization failures across several infrastructure components, including the build dashboard and deploy console, as group claims are returned inconsistently. Users see intermittent authz errors.

      **Causes**: Directory replication between the platform and primary directory servers is incomplete, producing inconsistent group-claim propagation.

      **Steps to resolve**: We are restoring directory replication and investigating remaining causes of intermittent group-claim failures.
    resolution_statement: The platform directory servers were not populating members for the core_platform_team group correctly. The team manually replicated the database from the primary directory servers to the platform servers, which fixed the issue.
  expected: Incomplete directory replication between the platform and primary directory servers left the platform servers not populating the core_platform_team group members correctly, so group claims were only returned intermittently through the access proxy. This caused intermittent authentication and authorization failures across components including the build dashboard and deploy console. It was resolved by manually replicating the database from the primary directory servers to the platform servers.
  metadata:
    reference_id: INC-8201
    status: closed
    created_at: '2026-03-17'
    affected_services: biztech_directory_auth

- input:
    summary: |-
      **Problem**: Migrating the metrics-exporter project to the new deploy platform caused a metrics outage. The switch from the old secrets injector to the new secrets manager generated the secret files as a single combined file instead of the multiple files the app expects. The exporter pod was also missing ingress settings for the collector to scrape it.

      **Solution**: The secret-file configuration was fixed and an ingress policy was added to the pod.
    resolution_statement: The secret definition was fixed so it creates multiple files per secret, as the app expects. The configuration was also updated to allow ingress into the exporter pod.
  expected: Migrating the metrics-exporter to the new deploy platform switched secret management from the old injector to the new secrets manager, and the configuration produced a single combined secret file instead of the multiple files the application expected; the exporter pod was also missing ingress settings for the collector to scrape it. This broke the flow of metrics. It was resolved by fixing the secret definition to create multiple files and adding an ingress policy to the exporter pod.
  metadata:
    reference_id: INC-8190
    status: closed
    created_at: '2026-03-10'
    affected_services: biztech_metrics_exporter

- input:
    summary: |-
      **Problem**: The office firewall uses internal DNS for resolution while the cloud provider handles public resolution, which can produce very different DNS responses. The IDE-licensing vendor uses geo-DNS, leading to a mismatch between what the local workstation environment and the firewall resolve to. The mismatch makes traffic fail to match policies and hit an explicit deny.

      **Impact**: Some engineers cannot use the licensed IDE. Already-authenticated IDEs keep working until the next license check-in; new license requests fail and the IDE fails to load.

      **Causes**: A delta between the workstation's DNS resolution and the firewall's resolution caused packets to be dropped.

      **Steps to resolve**: Network engineering added temporary policies allowing traffic from the regional IPs ahead of a permanent fix.
    resolution_statement: Network engineering added temporary policies to allow traffic from the regional IPs before pushing out a permanent fix.
  expected: A DNS resolution mismatch between engineers' workstation environment and the office firewall — driven by the firewall using internal DNS while the IDE-licensing vendor serves geo-DNS responses — caused license traffic to not match firewall policies and be dropped by an explicit deny. This blocked engineers from obtaining IDE licenses. Network engineering mitigated it by adding temporary policies to allow traffic from the regional IPs ahead of a permanent fix.
  metadata:
    reference_id: INC-8170
    status: closed
    created_at: '2026-03-02'
    affected_services: biztech_ide_licensing

- input:
    summary: |-
      **Problem**: Reporting data in the BI dashboards was not updating because new records were missing from the source tables and intermediate tables were refreshing late.

      **Impact**: BI dashboard data was stale and users did not see current information until manual restoration steps were completed.

      **Causes**: The events table reached the maximum value for its 32-bit integer primary key, which blocked new records from being inserted and left downstream tables out of date.

      **Steps to resolve**: We stopped affected jobs, migrated the primary key to a 64-bit integer, restarted imports, and rebuilt the intermediate tables.
    resolution_statement: Updated the primary key in the affected database to a 64-bit integer and re-triggered the reporting pipeline.
  expected: The events table reached the maximum value of its 32-bit integer primary key, which blocked new records from being inserted and left the downstream tables feeding the BI dashboards out of date, so reporting data went stale. It was resolved by migrating the primary key to a 64-bit integer and re-triggering the reporting pipeline to rebuild the affected tables.
  metadata:
    reference_id: INC-8155
    status: closed
    created_at: '2026-02-24'
    affected_services: biztech_bi_reporting

- input:
    summary: |-
      **Problem**: Configuration-management runs failed due to certificate verification errors from an expired certificate authority, causing a sharp drop in agent logs and missed alerts.

      **Impact**: Configuration management did not run for employee devices, blocking config updates to the production fleet. Mac devices resumed after a fix; some Windows devices remained behind until they checked in. No alerts fired because the error prevented logs from being generated.

      **Causes**: The configuration-management certificate authority expired, causing validation failures that prevented runs.

      **Steps to resolve**: We recreated the CA certificate and deployed it to all production compile hosts.
    resolution_statement: The team recreated the certificates and deployed them to the servers, which fixed the issue.
  expected: The configuration-management certificate authority (CA) certificate expired, causing certificate verification failures that prevented configuration runs and blocked config updates to the production device fleet. Because the error stopped logs from being generated, log-based monitoring produced no alerts. It was resolved by recreating the CA certificate and deploying it to the production compile hosts.
  metadata:
    reference_id: INC-8140
    status: closed
    created_at: '2026-02-23'
    affected_services: biztech_config_management

- input:
    summary: |-
      **Problem**: The Quillpad chat tool stopped working for users in production due to backend errors.

      **Impact**: Quillpad chat was broken for all employees in production. Closing and reopening the browser tab restored it for some users.

      **Causes**: An upgrade to one of the browser-storage backends caused unexpected behavior in production.

      **Steps to resolve**: The fix was applied and a workaround (reopen the tab) was shared.
    resolution_statement: The team reverted the change, which resolved the issue.
  expected: An upgrade to one of the browser-storage backends caused unexpected behavior in production, producing backend errors that broke the Quillpad chat tool for all employees. It was resolved by reverting the change, with closing and reopening the browser tab as an interim workaround.
  metadata:
    reference_id: INC-8120
    status: closed
    created_at: '2026-03-20'
    affected_services: biztech_quillpad

- input:
    summary: |-
      **Problem**: Pod restart rate was high in the telemetry-collector-prod namespace due to a misconfigured endpoint.

      **Impact**: No end users reported issues, but the high restart rate affected the telemetry-collector-prod namespace.


name: Label Issues by Type

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            const typeLabels = [
              'enhancement',
              'bug fix',
              'refactor',
              'documentation',
              'infrastructure',
              'investigation',
            ];

            const match = body.match(/###\s*🏷️ Type\s*\n+([^\n]+)/);
            if (!match) return;

            const selected = match[1].trim().toLowerCase();
            if (!typeLabels.includes(selected)) return;

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [selected],
            });
